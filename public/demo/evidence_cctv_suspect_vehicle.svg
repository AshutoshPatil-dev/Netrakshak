<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" style="background:#0f172a;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
  <!-- Dark CCTV monitor background -->
  <rect width="700" height="440" fill="#0f172a"/>
  
  <!-- CCTV Feed Simulation (Street scene & vehicle wireframe/box) -->
  <rect x="20" y="20" width="660" height="400" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Camera Grid Lines -->
  <line x1="20" y1="220" x2="680" y2="220" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="350" y1="20" x2="350" y2="420" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Camera HUD Overlay -->
  <g fill="#22c55e" font-family="monospace" font-size="12">
    <!-- Top Left -->
    <text x="40" y="50" font-weight="bold">● CAM-042 · PUNE SMART CITY SURVEILLANCE</text>
    <text x="40" y="68">LOC: FC ROAD / GOODLUCK CHOWK JUNCTION</text>

    <!-- Top Right -->
    <text x="640" y="50" text-anchor="end" font-weight="bold">REC [LIVE-FEED ARCHIVE]</text>
    <text x="640" y="68" text-anchor="end">2026-08-14 14:18:32 IST</text>
  </g>

  <!-- Vehicle Silhouette & Target Box -->
  <g transform="translate(180, 120)">
    <!-- ANPR Bounding Box -->
    <rect x="0" y="0" width="340" height="190" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Vehicle Body Outline -->
    <path d="M 40 120 L 80 60 L 220 60 L 280 120 L 310 120 L 310 150 L 30 150 L 30 120 Z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="80" cy="150" r="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="250" cy="150" r="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>

    <!-- ANPR Plate Overlay Tag -->
    <rect x="75" y="10" width="190" height="34" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="170" y="28" font-size="11" font-weight="bold" fill="#22c55e" text-anchor="middle" font-family="monospace">ANPR MATCH: 99.4%</text>
    <text x="170" y="40" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">MH-12-PQ-9081 (WHITE SWIFT)</text>
  </g>

  <!-- Evidence Tag Bottom -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="360" height="42" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="#475569"/>
    <text x="15" y="18" font-size="11" font-weight="bold" fill="#f87171" font-family="sans-serif">POLICE EVIDENCE: EX-CCTV-04</text>
    <text x="15" y="32" font-size="9.5" fill="#94a3b8" font-family="sans-serif">Suspect Sameer Khan vehicle observed exiting ATM lane</text>
  </g>

  <!-- Frame Counter -->
  <text x="640" y="395" font-size="11" fill="#64748b" text-anchor="end" font-family="monospace">FRAME: #448921 / 25 FPS</text>
</svg>
