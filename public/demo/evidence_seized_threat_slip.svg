<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" style="background:#fef3c7;font-family:'Courier New',Courier,monospace;">
  <!-- Torn notebook paper background -->
  <rect width="600" height="420" fill="#fef9e7"/>
  <rect x="25" y="25" width="550" height="370" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="4"/>

  <!-- Evidence Tag Top -->
  <rect x="25" y="25" width="550" height="45" fill="#d97706"/>
  <text x="45" y="52" font-size="14" font-weight="bold" fill="#ffffff" font-family="sans-serif">POLICE FORENSIC SEIZURE EXHIBIT · SWARGATE PS</text>
  <text x="550" y="52" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="end" font-family="sans-serif">EX-NOTE-01</text>

  <!-- Threat note content -->
  <g transform="translate(60, 100)" font-size="16" fill="#7f1d1d" font-family="'Segoe Print','Comic Sans MS',sans-serif" font-weight="bold">
    <text x="0" y="30">सुनील जगताप (टिंबर मार्केट),</text>
    <text x="0" y="70">अण्णांचा निरोप आहे. ५ लाख रुपये रोख तयार ठेव.</text>
    <text x="0" y="110">पोलीसात गेला तर दुकान आणि कुटुंब दोन्ही संपवू.</text>
    <text x="0" y="150">उद्या संध्याकाळी ६ वाजता पल्सरवर पोरगा येईल.</text>
    <text x="0" y="190">पैसे देऊन टाक. नाहीतर परिणाम भोगा.</text>

    <text x="350" y="225" font-size="18" fill="#991b1b">- अण्णा (Surya)</text>
  </g>

  <!-- Forensic Evidence Stamp -->
  <g transform="translate(380, 270) rotate(-6)">
    <rect x="0" y="0" width="160" height="60" rx="3" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 2"/>
    <text x="80" y="22" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="sans-serif">SEIZED EVIDENCE</text>
    <text x="80" y="38" font-size="11" font-weight="900" fill="#b91c1c" text-anchor="middle" font-family="sans-serif">FIR-MH-2026-1184</text>
    <text x="80" y="52" font-size="8" fill="#b91c1c" text-anchor="middle" font-family="sans-serif">DATE: 11-AUG-2026</text>
  </g>

  <rect x="25" y="365" width="550" height="30" fill="#fde68a"/>
  <text x="300" y="385" font-size="9" fill="#78350f" text-anchor="middle" font-family="sans-serif">Fingerprint Dusting: Positive Latent Prints on Surface · Transferred to Forensic Lab</text>
</svg>
