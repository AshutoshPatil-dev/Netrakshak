<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" style="background:#f8fafc;font-family:'Courier New',Courier,monospace;color:#1e293b;">
  <rect width="800" height="1100" fill="#f8fafc"/>
  <rect x="25" y="25" width="750" height="1050" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Watermark -->
  <text x="400" y="580" fill="#dc2626" opacity="0.04" font-size="64" font-weight="900" text-anchor="middle" transform="rotate(-30 400 580)" font-family="sans-serif">SPECIAL ENFORCEMENT CELL</text>

  <!-- Police Header -->
  <g transform="translate(50, 45)">
    <circle cx="350" cy="30" r="22" fill="#991b1b" opacity="0.1"/>
    <text x="350" y="26" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle" font-family="sans-serif">CRIME BRANCH · SPECIAL OPERATIONS SQUAD</text>
    <text x="350" y="38" font-size="8" fill="#64748b" text-anchor="middle" font-family="sans-serif">ANTI-NARCOTICS &amp; HAWALA SURVEILLANCE UNIT</text>

    <text x="350" y="68" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle" font-family="sans-serif">CRIME INVESTIGATION REPORT (SPECIAL DOCKET)</text>
    <text x="350" y="86" font-size="17" font-weight="900" fill="#0f172a" text-anchor="middle" font-family="sans-serif" letter-spacing="1">FIRST INFORMATION REPORT (FORM II)</text>
    <text x="350" y="102" font-size="10" fill="#475569" text-anchor="middle" font-family="sans-serif">(Under Section 154 Cr.P.C. &amp; NDPS Act 1985)</text>
  </g>

  <line x1="50" y1="165" x2="750" y2="165" stroke="#991b1b" stroke-width="2"/>
  <line x1="50" y1="169" x2="750" y2="169" stroke="#991b1b" stroke-width="0.8"/>

  <!-- Top Metadata Grid -->
  <g transform="translate(60, 185)" font-size="11" fill="#1e293b">
    <text x="0" y="15" font-weight="bold">1. Jurisdiction:</text>
    <text x="140" y="15" font-family="sans-serif" font-weight="600">Anti-Narcotics Special Cell, Crime Branch Pune</text>

    <text x="0" y="38" font-weight="bold">2. FIR Docket No.:</text>
    <text x="140" y="38" font-family="sans-serif" font-weight="bold" fill="#b91c1c">FIR-MH-2026-7290</text>

    <text x="360" y="38" font-weight="bold">Date &amp; Time:</text>
    <text x="495" y="38" font-family="sans-serif">16/08/2026 21:15 HRS</text>

    <text x="0" y="61" font-weight="bold">3. Acts &amp; Sections:</text>
    <text x="140" y="61" font-family="sans-serif" font-weight="700" fill="#b91c1c">NDPS Act 8(c), 20(b)(ii)(C), 29, IPC 120B, PMLA Sec 3</text>
  </g>

  <!-- Section 1: Complainant/Reporting Officer -->
  <rect x="50" y="275" width="700" height="24" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="291" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">1. COMPLAINANT / REPORTING OFFICER DETAILS</text>
  <g transform="translate(60, 310)" font-size="11" fill="#1e293b">
    <text x="0" y="15" font-weight="bold">Reporting Officer:</text>
    <text x="140" y="15" font-family="sans-serif" font-weight="600">API Ramesh V. Thorat (Anti-Narcotics Cell)</text>
    <text x="0" y="35" font-weight="bold">Station / Unit:</text>
    <text x="140" y="35" font-family="sans-serif">Special Operations Wing, Police Commissionerate Pune</text>
  </g>

  <!-- Section 2: Suspects -->
  <rect x="50" y="370" width="700" height="24" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="386" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">2. ACCUSED / NETWORK OPERATIVES</text>
  <g transform="translate(60, 405)" font-size="11" fill="#1e293b">
    <text x="0" y="15" font-weight="bold">(a) Primary Accused:</text>
    <text x="150" y="15" font-family="sans-serif" font-weight="bold" fill="#b91c1c">Vikram Rathi</text>
    <text x="360" y="15" font-weight="bold">Role / Syndicate:</text>
    <text x="480" y="15" font-family="sans-serif" font-weight="600">Hawala Logistics Operator</text>

    <text x="0" y="35" font-weight="bold">(b) Key Associates:</text>
    <text x="150" y="35" font-family="sans-serif" font-weight="600">Sameer Khan, Ajay Deshmukh, Rohan Mehta</text>

    <text x="0" y="55" font-weight="bold">(c) Active Phone:</text>
    <text x="150" y="55" font-family="sans-serif" font-weight="bold" fill="#0b3d91">+91 97654 32109</text>
    <text x="360" y="55" font-weight="bold">Vehicle Seized:</text>
    <text x="480" y="55" font-family="sans-serif">MH-12-KH-4402 (Grey Creta)</text>

    <text x="0" y="75" font-weight="bold">(d) Hawala Channel:</text>
    <text x="150" y="75" font-family="sans-serif" font-weight="bold" fill="#0f766e">Token Exchange System · Courier Point Raviwar Peth</text>
  </g>

  <!-- Section 3: Modus Operandi -->
  <rect x="50" y="515" width="700" height="24" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="531" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">3. OPERATIONAL FACTS &amp; SEIZURE MEMO</text>
  <g transform="translate(60, 552)" font-size="10.5" fill="#334155" font-family="sans-serif">
    <text x="0" y="15">Acting on confidential intelligence, special squad intercepted accused Vikram Rathi near Hinjawadi</text>
    <text x="0" y="32">Phase 1 Highway Junction. Accused was operating a conduit routing illicit contraband consignments</text>
    <text x="0" y="49">and laundering cash proceeds via cash courier notes (hawala tokens) linked to Sameer Khan's cyber</text>
    <text x="0" y="66">syndicate. Multiple burner SIM cards, encrypted communication devices, and token ledger seized on spot.</text>
  </g>

  <!-- Section 4: Property Seized -->
  <rect x="50" y="645" width="700" height="24" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="661" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">4. RECOVERED PROPERTY &amp; EVIDENCE EXHIBITS</text>
  <g transform="translate(60, 682)" font-size="10.5" fill="#334155" font-family="sans-serif">
    <text x="0" y="15">1. Cash Hawala Proceeds: INR 8,20,000 in unaccounted cash denominations.</text>
    <text x="0" y="32">2. Electronic Devices: 2x OnePlus Smartphones with Signal/Threema chats, 4x Unregistered SIMs.</text>
    <text x="0" y="49">3. CDR Intercept: Continuous telecom bursts between (+91 97654 32109) and (+91 98811 55421).</text>
  </g>

  <!-- Official Seal in Crimson Red -->
  <g transform="translate(100, 810) rotate(-4)">
    <circle cx="120" cy="70" r="48" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 2" opacity="0.85"/>
    <circle cx="120" cy="70" r="40" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.85"/>
    <text x="120" y="55" font-size="7.5" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="sans-serif">ANTI-NARCOTICS CELL</text>
    <text x="120" y="72" font-size="8.5" font-weight="900" fill="#dc2626" text-anchor="middle" font-family="sans-serif">★ CRIME BRANCH PUNE ★</text>
    <text x="120" y="87" font-size="7" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="sans-serif">16 AUG 2026 · SEIZED &amp; FILED</text>
  </g>

  <!-- Officer Signature -->
  <g transform="translate(480, 850)">
    <path d="M 0 30 Q 30 5, 70 28 T 120 18 T 160 35" fill="none" stroke="#991b1b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="46" x2="180" y2="46" stroke="#64748b" stroke-width="1"/>
    <text x="90" y="62" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">API R. V. Thorat</text>
    <text x="90" y="75" font-size="9" fill="#475569" text-anchor="middle" font-family="sans-serif">Investigating Officer, Special Ops</text>
  </g>

  <line x1="50" y1="1040" x2="750" y2="1040" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="1058" font-size="8.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">Government of Maharashtra · Department of Police · Official Court Docket Copy</text>
</svg>
